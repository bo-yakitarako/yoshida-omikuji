pre-commit:
  piped: true
  commands:
    lint:
      run: mise exec -- bun run lint
    fmt:
      run: mise exec -- bun run fmt
      stage_fixed: true
    encrypt:
      run: mise exec -- bun run encrypt -- --all
      stage_fixed: true
    workflow:
      run: mise exec -- bun run gen:workflow ssh && git add .github/workflows/deploy.yaml disbord.config.ts $([ -d assets ] && echo assets)
